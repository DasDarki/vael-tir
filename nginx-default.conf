server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Gehashte Build-Assets dürfen aggressiv gecacht werden
  location /_nuxt/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Kartenkacheln: viele kleine JPGs, lange cachen
  location /map_tiles/ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Prerenderte Seiten (Verzeichnis/index.html), sonst SPA-Fallback (200.html)
  location / {
    try_files $uri $uri/ $uri.html /200.html;
  }
}
